openapi: 3.0.3

info:
  title: Internship Placement and Matching API
  version: 1.0.0
  description: |
    API contract for an explainable university internship placement and
    matching system.

    The API supports:

    - Student profiles and preferences
    - Academic eligibility evaluations
    - Employer registration and verification
    - Internship opportunity management
    - Structured opportunity requirements
    - Internship applications
    - Requirement and compatibility evaluations
    - Explainable placement recommendations
    - Human review and manual overrides
    - Placement offers and capacity reservations
    - Final placement confirmation
    - Internship outcomes
    - Unplaced-student intervention cases

    The API represents a system-design case study rather than a deployed
    production service.

    Placement recommendations are advisory. Final placement confirmation
    requires authorized human review and the required student, employer,
    academic and career-center decisions.

  contact:
    name: Decision Systems Casebook
  license:
    name: Portfolio Case Study

servers:
  - url: https://api.example-university.edu/internship-placement/v1
    description: Example production server
  - url: https://sandbox.example-university.edu/internship-placement/v1
    description: Example sandbox server

security:
  - bearerAuth: []

tags:
  - name: Students
    description: Student profile, skills and preference operations
  - name: Eligibility
    description: Academic eligibility evaluation and exception operations
  - name: Employers
    description: Employer registration, verification and status operations
  - name: Opportunities
    description: Internship opportunity and requirement operations
  - name: Applications
    description: Internship application lifecycle operations
  - name: Matching
    description: Requirement evaluation and compatibility operations
  - name: Recommendations
    description: Explainable placement recommendation operations
  - name: Decisions
    description: Authorized human review and override operations
  - name: Offers
    description: Placement offer and capacity-reservation operations
  - name: Placements
    description: Final placement and cancellation operations
  - name: Outcomes
    description: Internship completion and evaluation operations
  - name: Interventions
    description: Unplaced-student intervention operations

paths:
  /students/{studentId}:
    get:
      tags:
        - Students
      summary: Get student placement profile
      description: |
        Returns the authorized internship-placement view of a student.

        Academic information may be retrieved from an authoritative university
        source and is not directly editable by the student.
      operationId: getStudent
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Student profile returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /students/{studentId}/profile:
    get:
      tags:
        - Students
      summary: Get student-editable profile
      operationId: getStudentProfile
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Student profile returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Students
      summary: Update student-editable profile
      description: |
        Updates fields that the student or authorized career-center role may
        maintain.

        Authoritative academic information cannot be modified through this
        operation.
      operationId: updateStudentProfile
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentProfileUpdateRequest"
      responses:
        "200":
          description: Student profile updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /students/{studentId}/skills:
    get:
      tags:
        - Students
      summary: List student skills
      operationId: listStudentSkills
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Student skills returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentSkill"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags:
        - Students
      summary: Add student skill
      operationId: createStudentSkill
      parameters:
        - $ref: "#/components/parameters/StudentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentSkillCreateRequest"
      responses:
        "201":
          description: Student skill created successfully
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSkill"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /students/{studentId}/preferences:
    get:
      tags:
        - Students
      summary: List active student preferences
      operationId: listStudentPreferences
      parameters:
        - $ref: "#/components/parameters/StudentId"
      responses:
        "200":
          description: Student preferences returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentPreference"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    put:
      tags:
        - Students
      summary: Replace active student preferences
      description: |
        Creates a new version of the student's active preference set.

        Historical recommendations continue to reference the preference
        version used when they were generated.
      operationId: replaceStudentPreferences
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentPreferenceSetRequest"
      responses:
        "200":
          description: Preference version created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentPreferenceSet"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /students/{studentId}/eligibility-evaluations:
    get:
      tags:
        - Eligibility
      summary: List academic eligibility evaluations
      operationId: listEligibilityEvaluations
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/PlacementCycleIdQuery"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Eligibility evaluations returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityEvaluationPage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags:
        - Eligibility
      summary: Evaluate academic eligibility
      description: |
        Evaluates a student against the active institution-level and
        department-specific academic rules for a placement cycle.
      operationId: createEligibilityEvaluation
      parameters:
        - $ref: "#/components/parameters/StudentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EligibilityEvaluationRequest"
      responses:
        "201":
          description: Eligibility evaluation created successfully
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityEvaluation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /eligibility-evaluations/{evaluationId}:
    get:
      tags:
        - Eligibility
      summary: Get academic eligibility evaluation
      operationId: getEligibilityEvaluation
      parameters:
        - $ref: "#/components/parameters/EvaluationId"
      responses:
        "200":
          description: Eligibility evaluation returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EligibilityEvaluation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /eligibility-evaluations/{evaluationId}/exceptions:
    post:
      tags:
        - Eligibility
      summary: Create academic exception request
      description: |
        Creates a request for an authorized academic role to review a
        permitted exception.

        Creating the request does not approve the exception.
      operationId: createAcademicExceptionRequest
      parameters:
        - $ref: "#/components/parameters/EvaluationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicExceptionCreateRequest"
      responses:
        "201":
          description: Academic exception request created successfully
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicException"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /academic-exceptions/{exceptionId}/decision:
    post:
      tags:
        - Eligibility
      summary: Decide academic exception request
      description: |
        Approves or rejects an academic exception request.

        Only an authorized academic role may approve an academic exception.
      operationId: decideAcademicException
      parameters:
        - $ref: "#/components/parameters/ExceptionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcademicExceptionDecisionRequest"
      responses:
        "200":
          description: Academic exception decision recorded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicException"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /employers:
    get:
      tags:
        - Employers
      summary: List employers
      operationId: listEmployers
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EmployerStatus"
        - name: industry
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Employers returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployerPage"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Employers
      summary: Register employer
      operationId: createEmployer
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployerCreateRequest"
      responses:
        "201":
          description: Employer registration created successfully
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /employers/{employerId}:
    get:
      tags:
        - Employers
      summary: Get employer
      operationId: getEmployer
      parameters:
        - $ref: "#/components/parameters/EmployerId"
      responses:
        "200":
          description: Employer returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employer"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Employers
      summary: Update employer information
      operationId: updateEmployer
      parameters:
        - $ref: "#/components/parameters/EmployerId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployerUpdateRequest"
      responses:
        "200":
          description: Employer updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"

  /employers/{employerId}/status-decisions:
    post:
      tags:
        - Employers
      summary: Record employer status decision
      description: |
        Activates, restricts, suspends, rejects or deactivates an employer.

        The previous status and decision reason are retained in audit history.
      operationId: createEmployerStatusDecision
      parameters:
        - $ref: "#/components/parameters/EmployerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployerStatusDecisionRequest"
      responses:
        "200":
          description: Employer status updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /employers/{employerId}/opportunities:
    get:
      tags:
        - Opportunities
      summary: List employer opportunities
      operationId: listEmployerOpportunities
      parameters:
        - $ref: "#/components/parameters/EmployerId"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OpportunityStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Employer opportunities returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityPage"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags:
        - Opportunities
      summary: Create internship opportunity
      operationId: createOpportunity
      parameters:
        - $ref: "#/components/parameters/EmployerId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityCreateRequest"
      responses:
        "201":
          description: Internship opportunity created successfully
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternshipOpportunity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /opportunities:
    get:
      tags:
        - Opportunities
      summary: Search internship opportunities
      operationId: listOpportunities
      parameters:
        - name: placementCycleId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/OpportunityStatus"
        - name: academicProgramId
          in: query
          required: false
          schema:
            type: string
        - name: industry
          in: query
          required: false
          schema:
            type: string
        - name: city
          in: query
          required: false
          schema:
            type: string
        - name: workingModel
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/WorkingModel"
        - name: availableCapacityOnly
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Internship opportunities returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityPage"

  /opportunities/{opportunityId}:
    get:
      tags:
        - Opportunities
      summary: Get internship opportunity
      operationId: getOpportunity
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "200":
          description: Internship opportunity returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternshipOpportunity"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags:
        - Opportunities
      summary: Update internship opportunity
      description: |
        Updates an opportunity.

        A material change may place the opportunity back into review and may
        require active applications to be reevaluated.
      operationId: updateOpportunity
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityUpdateRequest"
      responses:
        "200":
          description: Internship opportunity updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternshipOpportunity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /opportunities/{opportunityId}/review-decisions:
    post:
      tags:
        - Opportunities
      summary: Review internship opportunity
      description: |
        Approves, rejects, returns or restricts an internship opportunity.

        Approval may require both operational and academic review.
      operationId: createOpportunityReviewDecision
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityReviewDecisionRequest"
      responses:
        "200":
          description: Opportunity review decision recorded successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InternshipOpportunity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /opportunities/{opportunityId}/requirements:
    get:
      tags:
        - Opportunities
      summary: List opportunity requirements
      operationId: listOpportunityRequirements
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "200":
          description: Opportunity requirements returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpportunityRequirement"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags:
        - Opportunities
      summary: Add structured opportunity requirement
      operationId: createOpportunityRequirement
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpportunityRequirementCreateRequest"
      responses:
        "201":
          description: Opportunity requirement created successfully
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityRequirement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /opportunities/{opportunityId}/capacity:
    get:
      tags:
        - Opportunities
      summary: Get current opportunity capacity
      operationId: getOpportunityCapacity
      parameters:
        - $ref: "#/components/parameters/OpportunityId"
      responses:
        "200":
          description: Opportunity capacity returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpportunityCapacity"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /applications:
    get:
      tags:
        - Applications
      summary: List internship applications
      operationId: listApplications
      parameters:
        - name: studentId
          in: query
          required: false
          schema:
            type: string
        - name: opportunityId
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ApplicationStatus"
        - name: placementCycleId
          in: query
          required: false
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Applications returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationPage"
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags:
        - Applications
      summary: Submit internship application
      description: |
        Validates profile completeness, eligibility, deadline, document,
        application-limit and placement-conflict rules before submission.
      operationId: createApplication
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationCreateRequest"
      responses:
        "201":
          description: Application submitted successfully
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /applications/{applicationId}:
    get:
      tags:
        - Applications
      summary: Get internship application
      operationId: getApplication
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
      responses:
        "200":
          description: Application returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /applications/{applicationId}/withdrawal:
    post:
      tags:
        - Applications
      summary: Withdraw internship application
      operationId: withdrawApplication
      parameters:
        - $ref: "#/components/parameters/ApplicationId"
        - $ref: "#/components/parameters/IdempotencyKey"
