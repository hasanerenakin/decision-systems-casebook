components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Example bearer-token authentication.

        Production implementation should use the university-approved identity
        and access-management service.

  parameters:
    StudentId:
      name: studentId
      in: path
      required: true
      description: Stable student identifier
      schema:
        type: string
        example: STUDENT-1042

    EmployerId:
      name: employerId
      in: path
      required: true
      description: Employer identifier
      schema:
        type: string
        example: EMP-0081

    OpportunityId:
      name: opportunityId
      in: path
      required: true
      description: Internship opportunity identifier
      schema:
        type: string
        example: OPP-2026-0045

    ApplicationId:
      name: applicationId
      in: path
      required: true
      description: Internship application identifier
      schema:
        type: string
        example: APP-2026-0231

    EvaluationId:
      name: evaluationId
      in: path
      required: true
      description: Academic eligibility evaluation identifier
      schema:
        type: string
        example: ELIG-2026-0188

    ExceptionId:
      name: exceptionId
      in: path
      required: true
      description: Academic exception identifier
      schema:
        type: string
        example: AEX-2026-0031

    RecommendationId:
      name: recommendationId
      in: path
      required: true
      description: Placement recommendation identifier
      schema:
        type: string
        example: REC-2026-0128

    DecisionId:
      name: decisionId
      in: path
      required: true
      description: Human placement decision identifier
      schema:
        type: string
        example: DEC-2026-0099

    OverrideId:
      name: overrideId
      in: path
      required: true
      description: Manual override identifier
      schema:
        type: string
        example: OVR-2026-0012

    OfferId:
      name: offerId
      in: path
      required: true
      description: Placement offer identifier
      schema:
        type: string
        example: OFFER-2026-0072

    PlacementId:
      name: placementId
      in: path
      required: true
      description: Confirmed placement identifier
      schema:
        type: string
        example: PL-2026-0044

    InterventionCaseId:
      name: interventionCaseId
      in: path
      required: true
      description: Intervention-case identifier
      schema:
        type: string
        example: INT-2026-0028

    PlacementCycleIdQuery:
      name: placementCycleId
      in: query
      required: false
      schema:
        type: string
        example: CYCLE-2026-SUMMER

    Page:
      name: page
      in: query
      required: false
      description: One-based page number
      schema:
        type: integer
        minimum: 1
        default: 1

    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of records per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Unique key used to prevent duplicate processing of repeated write
        requests.
      schema:
        type: string
        minLength: 8
        maxLength: 100

    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        Entity version used for optimistic concurrency control.
      schema:
        type: string
        example: '"version-4"'

  headers:
    Location:
      description: URI of the created resource
      schema:
        type: string
        format: uri

  responses:
    BadRequest:
      description: Request structure or value is invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Forbidden:
      description: Authenticated user is not authorized for the operation
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    NotFound:
      description: Requested resource does not exist or is not visible
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    Conflict:
      description: Request conflicts with the current resource or workflow state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    PreconditionFailed:
      description: Resource version does not match the supplied precondition
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

    UnprocessableEntity:
      description: |
        Request is structurally valid but violates one or more business rules
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/BusinessRuleProblem"

